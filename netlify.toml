[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Custom headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vault"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  for = "/vault/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[redirects]]
  from = "/projects"
  to = "/work"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/work/:splat"
  status = 301

[[redirects]]
  from = "/Kene_CV.pdf"
  to = "/Kenechukwu_Nnakwue_CV_2026.pdf"
  status = 301

[[redirects]]
  from = "/my_cv.pdf"
  to = "/Kenechukwu_Nnakwue_CV_2026.pdf"
  status = 301

# Domain redirect - redirect codehermit.com to codehermit.netlify.app
[[redirects]]
  from = "https://codehermit.com/*"
  to = "https://codehermit.netlify.app/:splat"
  status = 301
  force = true 
